name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Public repo: fail if any data file is tracked (same rule as the pre-commit hook).
      - name: No participant data in the repo
        run: |
          bad=$(git ls-files | grep -E '\.(csv|tsv|zip|parquet|feather|pkl|pickle|xlsx|gz)$|(^|/)\.env$' | grep -v '^results/' || true)
          if [ -n "$bad" ]; then echo "Data files must not be committed:"; echo "$bad"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: ruff check .
      - run: pytest -q
      # Synthetic data only. Real mcPHASES data never leaves members' machines.
      - run: make baselines SYNTHETIC=1
