[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mealguide"
version = "0.1.0"
description = "Sensing-driven meal guidance across the menstrual cycle (COMS 6998, Fall 2026)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Ava's Step 1 scripts are imported as-is.
extend-exclude = ["scripts/step1_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
