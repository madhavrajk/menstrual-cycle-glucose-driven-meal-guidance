steps:
- Soften onion, carrot, garlic, and ginger in oil for 5 minutes.
- Add rinsed lentils and broth; simmer 25 minutes until tender.
- Stir in spinach until wilted, then lemon juice just before serving.
notes: Lemon goes in at the end so heat doesn't destroy its vitamin C. If no low-sodium broth match exists
  in FoodData Central, use water plus herbs.
