- omnivore
allergens:
- fish
active_time_min: 15
total_time_min: 30
servings: 1
ingredients:
- name: Atlantic mackerel fillet
  grams: 120
  fdc_query: Fish, mackerel, Atlantic, raw
  fdc_id: 175119
  fdc_description: Fish, mackerel, Atlantic, raw
  fdc_verified: false
- name: Potatoes, with skin
  grams: 200
  fdc_query: Potatoes, flesh and skin, raw
  fdc_id: 170026
  fdc_description: Potatoes, flesh and skin, raw
  fdc_verified: false
- name: Green beans
  grams: 80
  fdc_query: Beans, snap, green, raw
  fdc_id: 2346400
  fdc_description: Beans, snap, green, raw
  fdc_verified: false
- name: Onion
  grams: 20
  fdc_query: Onions, raw
  fdc_id: 170000
  fdc_description: Onions, raw
  fdc_verified: false
- name: Parsley
  grams: 5
  fdc_query: Parsley, fresh
  fdc_id: 170416
