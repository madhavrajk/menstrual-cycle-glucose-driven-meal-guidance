evidence_tags:
- omega3
- b6
- vitamin_c
- protein_first
- low_sodium
steps:
- Boil potatoes 15 minutes, adding green beans for the last 4.
- Bake or pan-cook mackerel until it flakes.
- Toss with onion, parsley, lemon, and oil.
notes: Mackerel is one of the richest omega-3 fish.
