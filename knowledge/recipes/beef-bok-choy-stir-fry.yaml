steps:
- Stir-fry beef in hot oil for 2 minutes and set aside.
- Stir-fry pepper, bok choy, ginger, and garlic for 3 minutes.
- Return beef, add soy sauce, and serve over rice.
notes: Red meat gives heme iron, the best-absorbed form; the pepper adds vitamin C.
