steps:
- Toss sweet potato with oil and cumin; roast at 220 °C for 25 minutes.
- Warm the beans and tortillas.
- Fill tortillas with beans, sweet potato, cabbage, and avocado; finish with lime.
notes: High in fiber; not a first pick on predicted bloating days.
