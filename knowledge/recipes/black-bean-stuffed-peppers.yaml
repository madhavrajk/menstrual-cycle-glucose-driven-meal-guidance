  fdc_verified: false
evidence_tags:
- iron
- magnesium
- vitamin_c
- calcium
- low_gi
steps:
- Halve and seed the peppers.
- Mix beans, quinoa, corn, tomatoes, and spices; fill the peppers.
- Top with cheddar and bake at 190 °C for 30 minutes.
notes: Skip the cheese for a vegan version (loses the calcium tag).
