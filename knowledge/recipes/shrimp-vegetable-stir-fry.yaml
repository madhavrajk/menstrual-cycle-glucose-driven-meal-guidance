steps:
- Stir-fry shrimp in oil for 2 minutes and set aside.
- Stir-fry vegetables, ginger, and garlic for 4 minutes.
- Return shrimp, add soy sauce, and serve over rice.
notes: Some frozen shrimp is treated with salt; check the label on bloating days.
