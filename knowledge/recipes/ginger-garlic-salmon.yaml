steps:
- Mix ginger, garlic, soy sauce, and sesame oil; brush over the salmon.
- Bake at 200 °C for 12–15 minutes.
- Steam broccoli and serve with rice.
notes: Tamari makes it wheat-free; coconut aminos make it soy- and wheat-free.
