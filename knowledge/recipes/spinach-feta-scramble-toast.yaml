id: spinach-feta-scramble-toast
name: Spinach and feta egg scramble with whole-grain toast
meal_type: breakfast
diets:
- omnivore
- vegetarian
allergens:
- egg
- milk
- wheat
active_time_min: 10
total_time_min: 10
servings: 1
ingredients:
- name: Eggs
  grams: 100
  fdc_query: Egg, whole, raw, fresh
  fdc_id: 171287
  fdc_description: Egg, whole, raw, fresh
  fdc_verified: false
- name: Baby spinach
  grams: 60
  fdc_query: Spinach, raw
  fdc_id: 168462
  fdc_description: Spinach, raw
  fdc_verified: false
- name: Feta cheese
  grams: 30
  fdc_query: Cheese, feta
  fdc_id: 173420
  fdc_description: Cheese, feta
  fdc_verified: false
- name: Whole-wheat bread
  grams: 40
