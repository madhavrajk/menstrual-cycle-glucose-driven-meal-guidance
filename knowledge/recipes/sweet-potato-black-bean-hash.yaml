- name: Red bell pepper
  grams: 60
  fdc_query: Peppers, sweet, red, raw
  fdc_id: 170108
  fdc_description: Peppers, sweet, red, raw
  fdc_verified: false
- name: Onion
  grams: 40
  fdc_query: Onions, raw
  fdc_id: 170000
  fdc_description: Onions, raw
  fdc_verified: false
- name: Olive oil
  grams: 7
  fdc_query: Oil, olive, salad or cooking
  fdc_id: 171413
