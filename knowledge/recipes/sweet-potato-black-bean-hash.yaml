total_time_min: 25
servings: 1
ingredients:
- name: Sweet potato
  grams: 150
  fdc_query: Sweet potato, raw, unprepared (Includes foods for USDA's Food Distribution Program)
  fdc_id: 168482
  fdc_description: Sweet potato, raw, unprepared (Includes foods for USDA's Food Distribution Program)
  fdc_verified: true
- name: Black beans, no salt added, drained
  grams: 85
  fdc_query: Beans, black, mature seeds, cooked, boiled, without salt
  fdc_id: 173735
  fdc_description: Beans, black, mature seeds, cooked, boiled, without salt
