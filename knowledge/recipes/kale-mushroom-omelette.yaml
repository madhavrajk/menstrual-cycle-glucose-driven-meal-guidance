steps:
- Cook mushrooms in oil for 3 minutes, then add kale until wilted.
- Pour in beaten eggs, cook until set, sprinkle cheddar, and fold.
- Serve with the toasted English muffin; eat the omelette first.
notes: Cheddar adds sodium; leave it out on predicted bloating days.
