steps:
- Cook pasta; save a little cooking water.
- Sauté fennel and garlic in oil until soft and golden, about 8 minutes.
- Add beans, pasta, and a splash of pasta water; finish with lemon and parmesan.
notes: Fennel bulb is far below the fennel doses used in the cramp trials, so the card must say the trials
  used supplements. Nutritional yeast replaces parmesan for a vegan version.
